<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Hello World</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #f7f8fa; color: #20242a; }
    main { padding: 2rem; text-align: center; }
    h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 600; letter-spacing: -0.04em; }
    p { margin: 1rem 0 0; color: #626a75; }
    @media (prefers-color-scheme: dark) {
      body { background: #111418; color: #edf0f4; }
      p { color: #a2aab6; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello World</h1>
    <p>SYSU GitHub Community · 正在开发中</p>
  </main>
</body>
</html>
